# Tests and a debug build for every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        run: ./gradlew --no-configuration-cache :core:domain:test :core:data:testDebugUnitTest :core:map:testDebugUnitTest :app:assembleDebug
      - name: Data pipeline tests
        run: |
          python3 -m pip install --quiet -r tools/requirements.txt
          cd tools && python3 -m unittest discover -s tests -q
