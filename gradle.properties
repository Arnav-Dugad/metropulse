org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 built-in Kotlin rejects `kotlin` DSL source sets by default; KSP registers generated sources that way.
android.disallowKotlinSourceSets=false

# Release versioning. CI overrides this from the git tag (-Pmetropulse.versionName=1.2.3).
metropulse.versionName=0.1.0
# Where the in-app updater looks for releases. Debug builds may override this for local testing.
metropulse.updateFeedUrl=https://api.github.com/repos/Arnav-Dugad/metropulse/releases/latest
# City database manifest written by tools/build_data.py. Static file, no server needed.
metropulse.dataManifestUrl=https://raw.githubusercontent.com/Arnav-Dugad/metropulse/main/data/manifest.json
# New York live predictions fetch the MTA's feeds directly from each phone. The MTA's data terms
# (term 1) forbid that without its permission; the maintainer has it (2026-10-30). Forks without
# that permission should set this to false.
metropulse.mtaRealtime=true
