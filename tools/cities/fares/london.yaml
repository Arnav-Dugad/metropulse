notes: >-
  2026 fares: Tube and TfL rail fares changed on 1 March 2026 (TfL press release, 2026-02-20). The
  zone 1 PAYG fare went from 2.90 to 3.10 peak and from 2.80 to 3.00 off-peak, and no zones 1-6 fare
  rose more than 20p. The fare-finder values above match the March 2026 table in Time Out for
  1-1 to 1-6 and for one to five zones outside zone 1 (2-2 to 2-6). The fare finder marks every row valid
  from 2026-07-04T23:00Z, at the same March 2026 prices. Most spans were checked with two station pairs
  that gave the same fare. Spans with zone 8 (other than 1-8) and 3-7 to 3-9 used a single pair.
  Peak exceptions the model ignores: (1) a journey that starts outside zone 1 between 16:00 and 19:00
  Mon-Fri and ends in zone 1 is charged off-peak. (2) Public holidays are off-peak. (3) Tube journeys to
  or from Heathrow are charged the peak fare at all times if they start, end or pass through zone 1.
  The fare finder confirms this: Heathrow Terminals 2 & 3 to Leicester Square is PAYG "Anytime" 5.90.
  Heathrow journeys that avoid zone 1 have normal peak/off-peak fares, e.g. Heathrow T2&3 to
  Hammersmith is 3.80/2.60. Engine suggestion: for a span touching zone 1 with a Heathrow terminal at
  either end, use the peak fare at all times.
  Where the span model can be wrong: TfL prices each origin-destination pair, and a few pairs differ from
  their span. Example: King's Cross St Pancras (1) to Caledonian Road (2) is charged the zone 1 fare
  (3.10/3.00), not 1-2 (3.60/3.10). Only about 90 pairs were sampled, so other exceptions may exist. For
  journeys that neither start nor end in zone 1, the fare finder's default fare is usually the
  "avoiding zone 1" fare. The API's default route for e.g. Finchley Road-Harrow-on-the-Hill is 2-5
  (3.40/2.50), with "via zone 1" listed separately at 5.30/3.80. A span model that takes the zones of the
  app's computed route will charge the zone 1 fare when that route dips into zone 1, even if TfL would
  not. Hanger Lane to Chorleywood is an example: the fare finder's default route gives 7.10/5.20, but
  "avoiding zones 1 and 2 via Ealing Broadway, Rayners Lane and Harrow-on-the-Hill" gives 4.20/2.50.
  Boundary stations list both zones. TfL is generally understood to charge the cheaper zone, so the
  engine should pick the zone at each end that gives the lowest fare. No TfL page stating this was read
  in this pass; see unknowns.
  DLR: no DLR-only fare differences were found; DLR fares equal Tube fares for the same span.
unknowns:
  - "zones [9, 9] / Amersham-Chesham and Chalfont & Latimer-Chesham: the TfL fare finder returns PAYG peak 0.00 / off-peak 0.60 (cash 2.55), which looks like a data error; not used"
  - Heathrow Terminal 4 to Heathrow Terminals 2 & 3 (zone 6-6) has no PAYG fare in the fare finder (only cash 7.00); whether travel between Heathrow terminals is free on the Tube was not confirmed
  - other origin-destination pairs whose fare differs from the span fare (like King's Cross St Pancras - Caledonian Road) were not enumerated
  - daily/weekly cap amounts not collected
  - boundary-station rule (charged as the cheaper zone) not confirmed from a TfL page
