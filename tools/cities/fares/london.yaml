cash_or_other_notes: >-
  Cash single (paper ticket), adult, from the same TfL fare finder: GBP 7.00 for every sampled journey
  within zones 1-6, and for zones 7-9 journeys that do not touch zones 1-2. Higher for zones 7-9 journeys
  that do: 1-7 8.70, 1-8 9.90, 1-9 10.30, 2-8 and 2-9 8.60. Journeys among Chalfont & Latimer, Amersham
  and Chesham cost 2.55.
  TfL caps PAYG spending per day and per week (Monday-Sunday). The caps and Travelcards are frozen until
  March 2027, per TfL's 2026-02-20 press release. Cap amounts were not collected and are not modelled.
  Child, 16+, 18+, Railcard, Freedom Pass and other concessions are not modelled. Night Tube fares are
  always off-peak.
