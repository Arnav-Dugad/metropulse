# London Underground + DLR zonal fares (TfL). Read 2026-10-30; fares in effect on that date.
type: zonal
currency: GBP
# span: fare looked up by the lowest and highest zone the journey touches.
rule: span
media: contactless       # adult contactless / Oyster pay as you go
peak:                    # TfL: "Monday to Friday (not on public holidays) between 06:30 and 09:30, and between 16:00 and 19:00"
  - {days: mon_fri, from: "06:30", to: "09:30"}
  - {days: mon_fri, from: "16:00", to: "19:00"}
