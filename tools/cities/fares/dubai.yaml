# Dubai Metro zonal fares (RTA nol). Read 2026-10-30; fares in effect on that date.
type: zonal
currency: AED
# count: fare looked up by how many fare zones the journey passes through.
rule: count
media: nol_silver        # Silver / Personal nol card, standard (Silver) class
# No peak pricing on Dubai Metro: peak omitted.
fares:
  # zones = number of zones passed through. RTA bands: "within 1 zone", "2 adjacent zones",
  # "more than 2 zones" (3 or more all cost the same).
  - {zones: 1, fare: 3.00}
  - {zones: 2, fare: 5.00}
  - {zones: 3, fare: 7.50}
  - {zones: 4, fare: 7.50}
  - {zones: 5, fare: 7.50}
  - {zones: 6, fare: 7.50}
  - {zones: 7, fare: 7.50}
cash_or_other_notes: >-
  RTA nol fares page (read 2026-10-30), AED per single journey, within 1 zone / 2 adjacent zones /
  more than 2 zones: Silver 3 / 5 / 7.5; Personal 3 / 5 / 7.5; Gold 6 / 10 / 15 (Gold class costs
  double: "Gold class passengers are charged a Gold Surcharge on top of their regular fares when using
  the tram and metro only"); nol Red ticket regular 4 / 6 / 8.5, Red ticket Gold 8 / 12 / 17. Each band
  allows a journey of up to 180 minutes with up to 3 transfers, and a change between two modes must be
  made within 30 minutes (one fare for the linked journey). Concessions (students, seniors, people of
  determination) and passes are not modelled.
