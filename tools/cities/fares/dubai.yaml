notes: >-
  Fares: RTA's nol fares page (7 zones; 3 bands). Station zones: zone_id in stops.txt of RTA's own GTFS
  (agency and feed_publisher "Road and Transport Authority (RTA)"), taken from the Mobility Database copy
  downloaded 2026-07-20 of a community republication of the RTA open-data feed (service calendar
  2025-08-29 to 2025-12-31). Dubai Pulse, RTA's open-data portal, refused connections from here, so the
  feed could not be fetched first-hand. Corroboration: Gulf News (rezoning report, last updated
  2018-09-15) says Zone 5 was split to create Zone 6 in Bur Dubai, which includes Khalid Bin Al Waleed
  (now BurJuman), Karama (now ADCB), Jafiliya (now max), World Trade Centre, Emirates Towers, Financial
  Centre, Burj Khalifa/Dubai Mall and Business Bay. It also says Green Line riders crossing the Creek
  between Deira (5) and Bur Dubai (6) pay for two zones. This matches the GTFS. Both lines have the same zone at
  the shared Union and BurJuman stations. Along the Red Line the zones run 5-6-2-1, and on the Expo branch
  2-(3)-1. On the Green Line they run 5-6. The count rule matches RTA's bands when every zone change along
  the line is between adjacent zones. For example, Union (5) to BurJuman (6) costs AED 5 and Centrepoint
  to Life Pharmacy (zones 5, 6, 2, 1) costs AED 7.50.
  Things the count model may get wrong: (1) a Gulf News report on the tariff revision says the minimum
  (1-zone) fare also covers "a distance of up to 3 kilometres even between two adjacent zones" (the page
  is marked last updated 2018). RTA's
  current fares page does not mention this rule, so it is not modelled. (2) Al Furjan (2) to Dubai
  Investment Park (1) passes the unopened Jumeirah Golf Estates station (zone 3). Counting only the
  zones of served stations gives 2 zones (AED 5). If RTA counts zone 3 as crossed, the fare would be
  AED 7.50; not confirmed.
unknowns:
  - whether the "up to 3 km between two adjacent zones = 1-zone fare" rule (older Gulf News tariff report) still applies
  - whether a journey between zones 2 and 1 on the Expo branch counts zone 3 (Jumeirah Golf Estates area) as crossed
  - station zones not confirmed against a current first-hand RTA zone list or map (the RTA network map PDF has a "Zone Number" legend, but its zone areas could not be read as text)
