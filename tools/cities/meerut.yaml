  notes: >-
    NCRTC fare list as reported by News Nation (22 Feb 2026, Hindi), minimum ₹20 and maximum ₹60.
    It is a per-station list from each terminus, not a published slab rule.
    From Modipuram: Meerut North 20, Daurli 20, MES Colony 30, Begumpul 30, Bhaisali 40,
    Meerut Central 50, Brahmpuri 50, Shatabdi Nagar 50, Rithani 50, Partapur 60, Meerut South 60.
    From Meerut South: Partapur 20, Rithani 20, Shatabdi Nagar 30, Brahmpuri 30, Meerut Central
    30, Bhaisali 40, Begumpul 40, MES Colony 50, Daurli 50, Meerut North 60, Modipuram 60.
    The fare basis (distance or station count) is not stated. TheSootr (22 Feb 2026) confirms
    ₹20 min / ₹60 max and Modipuram->Begumpul ₹30. Smart card or QR discounts were not found.
