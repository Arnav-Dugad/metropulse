      Weekday: Noapara 07:18-21:00, Jai Hind 07:40-21:20 (60 trips each way). Saturday: Noapara 07:18-21:00,
      Jai Hind 07:40-21:20. Sunday: Noapara 09:18-21:00, Jai Hind 09:40-21:20. Saturday and Sunday run about every
      18 minutes, with 20-24 minute gaps at the ends of the day. Only Noapara-Jai Hind is open; Jai Hind-Barasat is
      under construction per the 31.03.2026 system map.

fares:
  type: distance_slab
  applies_to_lines: [kol-blue]   # km bands are published for the Blue Line only
  currency: INR
  slabs:
    - {max_km: 2, fare: 5}
    - {max_km: 5, fare: 10}
    - {max_km: 10, fare: 15}
    - {max_km: 20, fare: 20}
    - {max_km: null, fare: 25}
  # Smart cards get 10% bonus value on recharge rather than a per-fare discount, so none is modelled.
  discounts: []
  notes: >-
    The slabs above are the Blue Line distance slabs from the 5 Dec 2019 revision (Business Today, 2019-11-27):
    0-2 km Rs 5, 2-5 km Rs 10, 5-10 km Rs 15, 10-20 km Rs 20, above 20 km Rs 25 (open-ended, max_km null). The
    current official Blue Line station-to-station table on the operator fare page uses exactly 5/10/15/20/25. The
    other lines have their own official station-to-station tables with different values: Green 5/10/20/30
    (Sector V-Howrah Maidan Rs 30); Purple, Orange and Yellow 5/10/20 (Joka-Majerhat Rs 20, Noapara-Jai Hind Rs 20).
    Their km bands are not published, so they are not encoded. The operator also publishes a combined
    Blue-Green-Orange interchange matrix (values up to Rs 50). Fare-chart values were read on 2026-10-29 and the
    page carries no effective date. Smart card terms are from the operator's Ticketing
    document: 10% bonus, Rs 80 security deposit, Rs 25 minimum balance. Students get a 60% concession (not
    modelled).
  source_urls:
    - https://oldmtp.indianrailways.gov.in/view_section.jsp?lang=0&id=0,2,661
    - https://oldmtp.indianrailways.gov.in/uploads/files/1716365367373-Ticketing.docx
    - https://www.businesstoday.in/latest/trends/story/kolkata-metro-fares-to-go-up-by-rs-5-from-december-5-239741-2019-11-27

