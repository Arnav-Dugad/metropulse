      Service runs only between Dakshineswar and Shahid Khudiram. Metro Railway suspended Shahid Khudiram-Kavi
      Subhash from 12:45 on 28.07.2025 "till further notice", and the closure was still listed on the operator page
      checked 2026-10-29. Official trip-level timetables: weekdays w.e.f. 27.07.2026, Saturday w.e.f. 01.08.2026,
      Sunday w.e.f. 09.08.2026. Metro Railway publishes departure lists, not headway bands. The headways here are
      medians of the gaps between departures from the two termini (Shahid Khudiram and Dakshineswar), computed per
      hour from those PDFs and rounded into bands. Extra short-turn trips (from Mahanayak Uttam Kumar, Dum Dum or
      Noapara) add trains on the central section. Weekday: first 06:00 from both termini; last 22:30 from Shahid
      Khudiram and 22:18 from Dakshineswar. Sunday: first 09:00. A senior Metro Railway official quoted by IANS
      (2026-07-22) said the 06:00 start and 22:30 finish are experimental. The site lists two weekday PDFs for the
      same date; the later upload ("WEEK DAYS BLUE LINE") was used. In OSM, one direction's relation has ref "Blue"
      and the other has an empty ref.

