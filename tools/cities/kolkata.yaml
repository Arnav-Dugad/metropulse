      Official HTML timetable on the operator page. Monday to Friday: 42 trips each way, first from Joka 06:40 and
      from Majerhat 07:03, last from Joka 21:05 and from Majerhat 21:26. Departures are about every 21 minutes,
      with the first gap 23 minutes. Saturday (w.e.f. 22.11.2025): first from Joka 13:25 and from Majerhat 13:49,
      last from Joka 20:11 and from Majerhat 20:32, every 21 minutes (one 28-minute gap). The operator states
      "SUNDAY METRO SERVICE NOT AVAILABLE". The value `no_service` is not in the README schema; replace it if the
      pipeline needs another representation. The operator page title still reads "JOKA-ESPLANADE"; only
      Joka-Majerhat is open.

