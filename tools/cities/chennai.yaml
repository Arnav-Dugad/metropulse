  - https://chennaimetrorail.org/wp-content/uploads/2023/11/Line-Map.pdf
  - https://chennaimetrorail.org/wp-content/uploads/2025/03/Phase-II-Map-Updated-Map-PHASE-2.pdf
  - https://chennaimetrorail.org/cmrl-fare-table/
  - https://chennaimetrorail.org/wp-content/uploads/2026/10/Fare-Table.pdf
  - https://chennaimetrorail.org/wp-content/uploads/2026/10/20-discounted-Fare.pdf
  - https://chennaimetrorail.org/store-value-pass-svp-online-qr/
  - https://www.thenewsminute.com/article/chennai-metro-fares-slashed-february-22-full-details-143818
  - https://www.dtnext.in/news/chennai/chennai-metro-records-over-104-crore-passengers-in-august
  - https://www.dtnext.in/news/chennai/commercial-metro-operations-from-poonamallee-to-vadapalani-will-commence-from-4-pm-on-sunday
  - https://www.dtnext.in/news/chennai/poonamalleevadapalani-metro-fare-to-start-at-rs-10-maximum-rs-40
  - https://swarajyamag.com/news-brief/six-stations-on-chennai-metros-poonamallee-vadapalani-corridor-remain-incomplete-despite-safety-clearance
