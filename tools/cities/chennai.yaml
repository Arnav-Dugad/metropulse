unknowns:
  - lines.che-blue.opened
  - lines.che-green.opened
  - lines.che-inter.opened
  - lines.che-inter.colour
  - lines.*.avg_speed_kmh
  - fares.slabs (km bands not restated by CMRL since 2021)
