      published. It shares KAFD-Ar Rabi-Uthman Bin Affan Road-SABIC with the Yellow Line (separate lines). The
      OSM colour tag (#7F00FF) is far bluer than the operator map colour.

fares:
  type: distance_slab
  currency: SAR
  slabs:
    - {max_km: null, fare: 4}
  notes: >-
    Riyadh Metro sells time-based tickets, not distance fares. RCRC: fares start from SAR 4, "valid for 2 hours
    from the first check-in". The standard-class 2-hour ticket (SAR 4) is the normal single-journey ticket, so
    it is encoded as a flat SAR 4 fare. Transfers and bus trips within the 2 hours are not modelled. Platinumlist
    (updated 2025-12-25) says regular ticket prices have not changed since the December 2024 launch: 2-hour pass
    SAR 4 standard, SAR 10 first class. Not modelled: first class, 3-day, 7-day and 30-day passes, the annual
    (SAR 1,260 / SAR 3,150) and student semester (SAR 260) passes from 2026-01-01, and the 50% concession for
    eligible groups (seniors, students and others). Children aged 6 and under travel free.
  source_urls:
    - https://www.rcrc.gov.sa/en/projects/king-abdulaziz-project-for-riyadh-public-transport-2/
    - https://platinumlist.net/guide/riyadh-metro-sets-annual-pass-prices-for-2026-here-are-the-fares
    - https://cairoscene.com/News/Riyadh-Metro-Updates-Fares-Introduces-Semester-Tickets-for-2026

