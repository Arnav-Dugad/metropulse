id: riyadh
name: Riyadh
state: Riyadh Province
country: Saudi Arabia
currency: SAR
timezone: Asia/Riyadh
bbox: [24.56, 46.54, 24.97, 46.87]   # from OSM route relation bounds of the six metro lines (Overpass, 2026-10-30)
checked: 2026-10-30

# Operating hours used by every line below (one network-wide schedule, no per-line timetable):
# Riyadh Public Transport (@RiyadhTransport, the RCRC public transport account) posted on 2025-09-05:
# "Riyadh Metro will now operate from 5:30 AM to 12:00 AM, Saturday till Thursday, and from 10:00 AM to
# 12:00 AM on Fridays." No later change to the regular hours was found (Ramadan and Eid schedules are
# temporary and are not modelled). These are system opening hours, not per-terminus first/last
# departures, so first = 05:30 / 10:00 and last = 24:00 for every line. Headways are not published
# by the operator (see unknowns).

lines:
  - id: ryd-blue
    name: Blue Line
    long_name: SABB – Ad Dar Al Baida
    operator: Royal Commission for Riyadh City (RCRC) / Riyadh Public Transport (RPT)
    colour: "#17A4D2"
    colour_source: >-
      RCRC Metro & Bus network map https://www.rcrc.gov.sa/static/app/uploads/2024/12/Map-1.pdf
      (line drawn in spot colour "Metro 1", CMYK alternate 80/8/1/0; converted to sRGB with the U.S. Web Coated
      SWOP profile RSWOP.icm, relative colorimetric)
    mode: metro
    termini: [SABB, Ad Dar Al Baida]
    opened: 2024-12-01
    osm:
      route: subway
      ref: "1"
      name_contains: "Blue Line"
    timetable:
      weekday:
        first: "05:30"
        last: "24:00"
        headways: null
      friday:
        first: "10:00"
        last: "24:00"
        headways: null
      saturday: same_as_weekday
      sunday: same_as_weekday
    avg_speed_kmh: null
    source_urls:
      - https://x.com/RiyadhTransport/status/1963922588771508440
      - https://gulfnews.com/world/gulf/saudi/saudi-arabia-riyadh-metro-adjusts-schedule-to-530am-in-push-to-ease-traffic-1.500259210
      - https://www.rcrc.gov.sa/en/projects/king-abdulaziz-project-for-riyadh-public-transport-2/
      - https://www.rcrc.gov.sa/en/rcrc-qasr-al-hokm-station-of-riyadh-metro-to-begin-operations-on-wednesday/
    notes: >-
      Line 1, 25 stations. Opened 2024-12-01 with some stations opening later: Ministry of Interior and Al
      Murabba later in December 2024 (Saudi Gazette headline), Al Murooj, Bank Albilad and King Fahad Library on
      2025-01-05 (SPA release on the Orange Line launch), and Qasr Al Hokm on 2025-02-26 at 06:00 (RCRC release
      dated 2025-02-25). No Blue Line station was found to be still closed on 2026-10-30. Hours: 05:30-24:00
      Saturday to Thursday, 10:00-24:00 Friday (RPT post 2025-09-05). These are network opening hours mapped
      directly to first/last trains. The operator publishes no headways. Unofficial guides give 3-5 min peak and
      5-10 min off-peak for the whole network; they are not used. OSM spells Al Murabba as "Al Muorabba" and has
      the colour tag #00AEE6.

  - id: ryd-red
    name: Red Line
    long_name: King Saud University – King Fahad Stadium
    operator: Royal Commission for Riyadh City (RCRC) / Riyadh Public Transport (RPT)
    colour: "#E84B3D"
    colour_source: >-
      RCRC Metro & Bus network map https://www.rcrc.gov.sa/static/app/uploads/2024/12/Map-1.pdf
      (spot colour "Metro 2", CMYK alternate 0/87/83/0; converted with RSWOP.icm, relative colorimetric)
    mode: metro
    termini: [King Saud University, King Fahad Stadium]
    opened: 2024-12-15
    osm:
      route: subway
      ref: "2"
      name_contains: "Red Line"
    timetable:
      weekday:
        first: "05:30"
        last: "24:00"
        headways: null
      friday:
        first: "10:00"
        last: "24:00"
        headways: null
      saturday: same_as_weekday
      sunday: same_as_weekday
    avg_speed_kmh: null
    source_urls:
      - https://x.com/RiyadhTransport/status/1963922588771508440
      - https://www.rcrc.gov.sa/en/projects/king-abdulaziz-project-for-riyadh-public-transport-2/
    notes: >-
      Line 2, 15 stations. Opened 2024-12-15. Hours as for the Blue Line (RPT post 2025-09-05). No headways
      published. RCRC lists an 8.4 km extension from King Saud University to Diriyah Gate (five new stations);
      it is not open and is not included. OSM still ends the line at King Saud University. In November 2025, five
      eastern stations were partly suspended for technical reasons (Saudi Gazette, per Wikipedia). That was a
      temporary disruption and is not modelled. The OSM colour tag is #EF3434.

  - id: ryd-orange
    name: Orange Line
    long_name: Jeddah Road – Khashm Al An
    operator: Royal Commission for Riyadh City (RCRC) / Riyadh Public Transport (RPT)
    colour: "#F2883F"
    colour_source: >-
      RCRC Metro & Bus network map https://www.rcrc.gov.sa/static/app/uploads/2024/12/Map-1.pdf
