      Line 5, 12 stations along King Abdulaziz Road. Opened 2024-12-15. Hours as for the Blue Line (RPT post
      2025-09-05). No headways published. Both OSM relations are named only "Green Line", and their from/to tags
      are in Arabic (وزارة التعليم / المتحف الوطني). The pipeline's headsign falls back to the relation's "to"
