    mode: metro
    termini: [Jeddah Road, Khashm Al An]
    opened: 2025-01-05
    osm:
      route: subway
      ref: "3"
      name_contains: "Orange Line"
    timetable:
      weekday:
        first: "05:30"
        last: "24:00"
        headways: null
      friday:
        first: "10:00"
        last: "24:00"
        headways: null
      saturday: same_as_weekday
      sunday: same_as_weekday
    avg_speed_kmh: null
    source_urls:
      - https://x.com/RiyadhTransport/status/1963922588771508440
      - https://www.rcrc.gov.sa/en/230241-2/
      - https://www.arabnews.com/saudi-arabia/riyadh-metros-landmark-western-station-opens-for-full-operations-2643649
      - https://www.railwaygazette.com/metro-metro-categories/2026/05/21/desert-sand-dune-inspired-metro-station-opens/
      - https://gulfnews.com/world/gulf/saudi/saudi-arabia-riyadh-expands-metro-network-with-new-orange-line-station-1.500178929
    notes: >-
      Line 3, 22 stations. Opened 2025-01-05 with only some stations in service. Other stations followed during
      2025 (e.g. Hassan bin Thabit Street, Gulf News, updated 2025-06-27). The last one, Western Station, opened on
      2026-05-15 (RCRC release dated 2026-05-14; Arab News 2026-05-15). Railway Gazette (2026-05-21) calls it the
      last of the line's 22 stations, so the whole line is treated as open. Hours as for the Blue Line (RPT post
      2025-09-05). No headways published. OSM names Railway Station "Railway". The OSM colour tag is #ED872D.

  - id: ryd-yellow
    name: Yellow Line
    long_name: King Abdullah Financial District – Airport T1-2
    operator: Royal Commission for Riyadh City (RCRC) / Riyadh Public Transport (RPT)
    colour: "#FFCB29"
    colour_source: >-
      RCRC Metro & Bus network map https://www.rcrc.gov.sa/static/app/uploads/2024/12/Map-1.pdf
