    notes: >-
      Line 4, 9 stations, serving King Khalid International Airport (T5, T3-4, T1-2). Opened 2024-12-01. Hours
      as for the Blue Line (RPT post 2025-09-05). No headways published. It shares the KAFD-Ar Rabi-Uthman Bin
      Affan Road-SABIC section with the Purple Line. They are two separate lines, not branches, so there is no
      combined headway. The OSM relations' "to" tag reads "Terminal 1-2", while the station is named
      "Airport T1-2". The OSM colour tag is #FFD009.

  - id: ryd-green
    name: Green Line
    long_name: Ministry of Education – National Museum
    operator: Royal Commission for Riyadh City (RCRC) / Riyadh Public Transport (RPT)
    colour: "#51AB3F"
    colour_source: >-
