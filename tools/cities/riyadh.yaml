      (spot colour "Metro 6", CMYK alternate 45/84/0/0; converted with RSWOP.icm, relative colorimetric)
    mode: metro
    termini: [King Abdullah Financial District, An Naseem]
    opened: 2024-12-01
    osm:
      route: subway
      # Both OSM relations are named only in Arabic ("المسار البنفسجي") with no name:en, so match by ref.
      ref: "6"
    timetable:
