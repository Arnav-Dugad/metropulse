    - https://www.thehitavada.com/Encyc/2026/9/15/bhopal-metro-15-minute-service-in-evening-peak-hrs-from-today.html
    - https://www.freepressjournal.in/bhopal/bhopal-metro-to-run-every-15-minutes-on-sundays-services-extended-till-830-pm

notes: >-
