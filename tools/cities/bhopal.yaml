    - {media: app_wallet_bonus, percent: null, note: "Recharge bonus 8% (₹200–499), 10% (₹500–999), 12% (₹1000–1499), 15% (₹1500–2000) per FPJ 6 Aug 2026. This is a top-up bonus, not a fare discount."}
  notes: >-
    No complete fare table was found. Free Press Journal (18 Dec 2025): up to one station ₹20,
    three to five stations ₹30, Subhash Nagar–AIIMS end to end ₹40; the two-station fare is
    not stated. The Hitavada (19 Dec 2025): minimum fare ₹20, no free-ride period. A
    third-party table (Yometro: ₹20/30/40/50/60/80 for 1–3/4–6/7–10/...) was found in search
    but not used.
  source_urls:
