    osm:
      ref: "1"
      name_contains: "Orange Line"
    timetable:
      weekday:
        first: "09:00"
        last: null
        headways:
          - {from: "09:00", to: "10:30", minutes: 15}
          - {from: "10:30", to: "17:30", minutes: 30}
          - {from: "17:30", to: "19:00", minutes: 15}
      saturday: null
      sunday:
        first: null
        last: "20:00"
        headways: null
    avg_speed_kmh: null
    source_urls:
      - https://www.thehitavada.com/Encyc/2026/9/15/bhopal-metro-15-minute-service-in-evening-peak-hrs-from-today.html
      - https://www.freepressjournal.in/bhopal/bhopal-metro-to-run-every-15-minutes-on-sundays-services-extended-till-830-pm
      - https://lalluram.com/change-in-bhopal-metro-service-timings/
    notes: >-
      LOW CONFIDENCE; SOURCES CONFLICT; NEWS ONLY. mpmetrorail.com could not be read. Weekday,
      per The Hitavada (15 Sep 2026): service starts 09:00; 09:00–10:30 every 15 min (peak),
      10:30–17:30 every 30 min (off-peak), 17:30–19:00 every 15 min (evening peak). The last
      weekday train is not stated. Free Press Journal (6 Aug 2026) gives the same peak windows.
      CONFLICT: Lalluram (14 Sep 2026, Hindi) says the timetable effective 15 Sep 2026 runs
      Mon–Sat 11:30–19:30 (Subhash Nagar first 11:30, last 19:00; AIIMS first 12:00, last
      19:30), every 15 min after 17:00. An earlier Jan 2026 cut moved the start to noon (Amar
      Ujala and Daily Jagran headlines). Sunday and holidays (Hitavada and FPJ): every 15 min
      all day; last train Subhash Nagar -> AIIMS 19:30 and AIIMS -> Subhash Nagar 20:00; first
      train not stated. Lalluram gives Sunday 11:30–20:30, every 15 min after 13:00. Sunday
      headways are left null because the morning frequency conflicts. Saturday: Hitavada says
      "weekdays" while Lalluram says Mon–Sat, so Saturday is unknown. Opening: Free Press
      Journal (18 Dec 2025) gives commercial operations from 21 Dec 2025 after a 20 Dec
      inauguration; AIR News (20 Dec 2025) reports services commenced that day. 8 stations,
      about 7 km. OSM network "Bhoj Metro", relations 19986926 / 19986927, colour #FB4F14.

