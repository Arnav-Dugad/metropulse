id: london
name: London
state: England
country: United Kingdom
currency: GBP
# Fill TfL StopPoint ids missing from OSM's NaPTAN tags from TfL's StopPoint search (for live arrivals).
tfl_codes: true
timezone: Europe/London
bbox: [51.40, -0.62, 51.71, 0.26]   # from OSM route relation bounds (Overpass, 2026-10-30): Morden 51.402 S, Chesham -0.611 W / 51.705 N, Upminster 0.253 E
checked: 2026-10-30

# How the timetables below were derived (applies to every line unless its notes say otherwise)
# - Source: TfL Unified API timetable responses (api.tfl.gov.uk/Line/{line}/Timetable/{stop}, read
#   2026-10-30), which list every scheduled departure (knownJourneys) per TfL day type ("Monday - Thursday",
#   "Friday", "Saturday", "Sunday", or "Monday - Friday" / "Saturdays and Public Holidays"). Where the API
#   returned incomplete day types, the TfL working timetable (WTT) or timetable notice PDF was read instead
#   (Central, District, Piccadilly; see their notes).
# - first / last: earliest / latest departure from any of the line's termini by a train that runs through the
#   line's central section (the trunk station named in notes). Short trips that never reach it (e.g. Epping -
#   Loughton late at night, Woodford - Hainault shuttle, Uxbridge - South Harrow) do not set the line's hours.
# - headways: for each clock hour, the mean gap between consecutive departures at the trunk station, averaged
#   over both directions where both were read, rounded to the nearest 0.25 min; consecutive hours with the same
#   value are merged. On branched lines (branch_mode: weighted) this is the COMBINED trunk headway, and
#   `branches` gives each OSM branch pattern's share of those trains, measured from TfL departure counts
#   (see each line's notes for the station, day type and hours used).
# - Night Tube (Central, Jubilee, Northern, Piccadilly, Victoria; Friday and Saturday nights): trains run all
#   night, so the friday block runs on to Saturday morning (last "29:xx") and the saturday block to Sunday
#   morning ("30:xx"). The day boundaries (05:30 Saturday, 07:00 Sunday; 05:45/07:00 on the Piccadilly, which
#   are the period boundaries in its timetable notice) were chosen by the maintainer; TfL's API itself splits
#   the days at about 03:00. Night frequencies come from the same TfL timetables.

