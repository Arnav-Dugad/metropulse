      Epping - Leytonstone/Woodford/Loughton (to 25:20) and are not counted. Sunday: Epping/Ealing 07:05,
      West Ruislip 06:41 (to White City only; first through train 07:12). WTT 71 summary: 24 tph White City -
      Leytonstone off-peak, 27-30 tph peak. Night Tube (WTT summary, Friday and Saturday nights from 00:30):
      every 10 min White City - Leytonstone, every 20 min Ealing Broadway - White City, Leytonstone - Hainault
      (via Newbury Park) and Leytonstone - Loughton; no night service to West Ruislip, Epping or Woodford -
      Hainault (via Grange Hill).
      Branch shares: Mon-Thu, all day, from the TfL API eastbound departures at Bank, classified by eastern
      end: Epping 156, Hainault/Newbury Park (via Newbury Park) 227, Loughton/Grange Hill 63. The Woodford -
      Hainault shuttle never reaches Bank, so its count (54 Hainault -> Woodford departures, API Friday
      schedule, the only one listed at Hainault; WTT 71 gives 3 tph all week) is added before normalising
      (total 500). Short trips ending at Leytonstone etc. are not counted. OSM pairs West Ruislip only with
      Epping and Ealing Broadway only with Hainault/Loughton, so the western ends are approximate (TfL
      westbound at Bank: West Ruislip/Northolt/Ruislip Gardens 162, Ealing Broadway 114, White City/North
      Acton 170). Because the shuttle takes a share of the Bank-based combined headway, central trains come out
      about 11% below the published frequency. Night (from 00:30 on Friday and Saturday nights): Ealing
      Broadway - Hainault via Newbury Park and the Loughton branch only (API Friday night at Bank: Hainault 9,
      Loughton 8 eastbound departures).

