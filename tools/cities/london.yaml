      weekends (Sat 05:47, Sun 07:35, until 23:49), except for a few early Mon-Fri trips. No Night Tube.
      Branch shares: Mon-Fri, all day, from the TfL API westbound departures at Earl's Court by destination:
      Wimbledon 248, Ealing Broadway 126, Richmond 118, Kensington (Olympia) 2 (total 494). Wimbledon trains
