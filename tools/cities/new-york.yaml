fares:
  type: distance_slab
  currency: USD
  slabs:
    - {max_km: null, fare: 3.00}
  notes: >-
    Flat fare: $3 per ride on the subway and local buses (MTA "Subway and bus fares" page, read 2026-10-30). The base
    fare rose from $2.90 to $3.00 on Sunday 4 January 2026 (MTA Board vote of 30 Sep 2025, NY1; in effect from
    4 Jan 2026, ABC7). No further increase before 2026-10-30 was found; the MTA page still lists $3. Not modelled:
    the OMNY weekly fare cap ($35 per 7-day period on subway and local bus; $67 including express bus), the one free
    transfer within two hours (subway-bus, bus-subway, bus-bus; out-of-system free transfers at Lexington Av/59 St -
    Lexington Av/63 St and Junius St - Livonia Av), reduced fare (half fare, $1.50, for seniors and riders with
    qualifying disabilities; reduced-fare weekly cap $17.50 per NY1), and the $3.50 single-ride ticket price
    approved in the same package (NY1; the MTA fares page does not list it). MetroCards could no longer be bought or
    refilled from 1 January 2026 (MTA fares page). Staten Island Railway: in January 2010 fares were collected only at
    St. George, the ballpark stop and (from that month) Tompkinsville, so rides between other SIR stations were free
    (Second Avenue Sagas, 2010-01-19). Current practice was not confirmed from an MTA page; it is not modelled, so the
    app will show $3 for every SIR trip. Riding within the subway between lines is free (one fare per
    entry), which the flat slab already gives.
  source_urls:
    - https://www.mta.info/fares-tolls/subway-bus
    - https://ny1.com/nyc/all-boroughs/news/2025/09/30/mta-board-approves-subway-and-bus-fare-hike-for-2026
    - https://abc7ny.com/post/mta-fare-increases-3-commuters-buses-subway-trains-nyc/18350815/
    - https://www.timeout.com/newyork/news/its-official-the-new-york-subway-is-now-more-expensive-than-its-ever-been-100125
    - https://secondavenuesagas.com/2010/01/19/fare-collection-at-sirs-tompkinsville-starts-wed/

