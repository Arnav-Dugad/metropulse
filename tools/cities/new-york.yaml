# GTFS stop extent is 40.5128,-74.2520 to 40.9031,-73.7554 (stops.txt, feed 20261028); OSM NYC Subway + SIR route
# relation bounds (Overpass, 2026-10-30) fall inside this box. Padded by about 0.01-0.02 degrees.
bbox: [40.49, -74.27, 40.92, -73.73]
checked: 2026-10-30

# One entry per GTFS route (29 routes in routes.txt). `gtfs_route` is the exact route_short_name; the three shuttles
# share route_short_name "S", so `gtfs_route_id` (the GTFS route_id) is given for every line as well.
# OSM: relations_for() uses name_contains when it is set (ref is then ignored). The names all start "NYCS - ",
# which keeps Newark Light Rail (ref 7), PATH and other systems in the box from matching.
