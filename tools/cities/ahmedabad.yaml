# Ahmedabad – Gandhinagar Metro (GMRC), all lines open on 2026-10-29, in one file.
# Excluded: Phase 2A/2B (Airport and GIFT City extensions) and Sabarmati Railway Station / Shahpur
# stations shown "WORK IN PROGRESS" in GMRC's journey planner.
id: ahmedabad
name: Ahmedabad – Gandhinagar
state: Gujarat
timezone: Asia/Kolkata
bbox: [22.98, 72.49, 23.25, 72.70]   # from OSM bounds of the operating route relations, +~0.01 margin
checked: 2026-10-29

lines:
