    long_name: Vastral Gam – Thaltej Gam (Line 1, East–West)
    operator: Gujarat Metro Rail Corporation Ltd (GMRC)
    colour: "#0181C8"
    colour_source: "operator network map https://www.gujaratmetrorail.com/ahmedabad/wp-content/uploads/RoutInfo/GMRC-Route-Map.jpg (legend swatch, sampled from JPEG)"
    mode: metro
    termini: [Vastral Gam, Thaltej Gam]
    opened: 2019-03-06
    osm:
      ref: "1"
      name_contains: "Blue Line"
    timetable:
      weekday:
        first: "06:20"
        last: "23:00"
        headways:
          - {from: "06:20", to: "07:00", minutes: 20}
          - {from: "07:00", to: "08:00", minutes: 10}
          - {from: "08:00", to: "11:00", minutes: 7}
          - {from: "11:00", to: "17:00", minutes: 10}
          - {from: "17:00", to: "20:00", minutes: 7}
          - {from: "20:00", to: "22:00", minutes: 10}
          - {from: "22:00", to: "23:00", minutes: 20}
      saturday:
        first: "06:20"
        last: "23:00"
        headways:
          - {from: "06:20", to: "07:00", minutes: 20}
          - {from: "07:00", to: "08:00", minutes: 12}
          - {from: "08:00", to: "11:00", minutes: 10}
          - {from: "11:00", to: "17:00", minutes: 12}
          - {from: "17:00", to: "20:00", minutes: 10}
          - {from: "20:00", to: "22:00", minutes: 12}
          - {from: "22:00", to: "23:00", minutes: 20}
      sunday:
        first: "06:20"
        last: "23:00"
        headways:
          - {from: "06:20", to: "07:00", minutes: 20}
          - {from: "07:00", to: "22:00", minutes: 12}
          - {from: "22:00", to: "23:00", minutes: 20}
    avg_speed_kmh: null
    source_urls:
      - https://www.gujaratmetrorail.com/ahmedabad/wp-content/uploads/2026/05/Revised-Time-Table-on-18.05.2026updated.jpg
      - https://www.gujaratmetrorail.com/ahmedabad/
    notes: >-
      GMRC timetable w.e.f. 2026-05-18: weekday peak "8:00 Hrs to 11:00 Hrs and 17:00 Hrs to
      20:00 Hrs" every 7 min; weekday non-peak and Saturday peak every 10 min; Saturday non-peak
      and Sunday full day every 12 min; all days 06:20–07:00 and 22:00–23:00 every 20 min. First
      06:20 and last 23:00 from both Vastral Gam and Thaltej Gam. Saturday peak hours are not
      defined separately; the weekday peak windows are assumed for Saturday. End-to-end 45 min,
      21.1 km (published; no commercial speed published). Thaltej Gam station opened 2024-12-08
      (Wikipedia). Colour: the same timetable sheet marks Line 1 with a lighter blue bar (~#00B3FA);
