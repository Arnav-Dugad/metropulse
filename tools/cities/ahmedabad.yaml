    colour_source: "operator timetable sheet line bar, https://www.gujaratmetrorail.com/ahmedabad/wp-content/uploads/2026/05/Revised-Time-Table-on-18.05.2026updated.jpg (sampled from JPEG)"
    mode: metro
    termini: [Koteshwar Road, Mahatma Mandir]
    opened: 2024-09-17
    osm:
      ref: "3"
      name_contains: "Yellow Line"
    timetable:
      weekday:
        first: "06:40"
        last: "21:20"
        headways:
          - {from: "06:40", to: "08:00", minutes: 40}
          - {from: "08:00", to: "21:20", minutes: 24}
      saturday: same_as_weekday
      sunday: same_as_weekday
    avg_speed_kmh: null
    source_urls:
      - https://www.gujaratmetrorail.com/ahmedabad/wp-content/uploads/2026/05/Revised-Time-Table-on-18.05.2026updated.jpg
