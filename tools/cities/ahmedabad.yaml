      Services for GNLU-GIFT City" (no trains: minutes null); 16:06–19:13 "Average 57 Minutes".
      First 07:36 from GNLU, 07:48 from GIFT City; last 18:57 from GNLU, 19:13 from GIFT City.
      6 min, 5.8 km. The sheet does not say which days this applies to (Lines 2 and 3 say "Monday
      to Sunday"; Line 4 does not), so Saturday/Sunday are null. Network map draws it red (#E31E25).

fares:
  type: distance_slab
  currency: INR
  slabs:
    - {max_km: 2.5, fare: 5}
    - {max_km: 7.5, fare: 10}
    - {max_km: 12.5, fare: 15}
    - {max_km: 17.5, fare: 20}
    - {max_km: 22.5, fare: 25}
    - {max_km: 30, fare: 30}
    - {max_km: 37.5, fare: 35}
    - {max_km: null, fare: 40}
  discounts:
    - {media: smart_card, percent: 10, note: "GMRC smart card (CSC): 10% on completion of journey; CSC/token valid only within Phase 1 (Ahmedabad) stations"}
    - {media: ncmc, percent: 10, note: "NCMC card: 10% on completion of journey across the GMRC network"}
  notes: >-
    No published km-slab table was found. Slabs were derived on 2026-10-29 from GMRC's own
    route-and-fare calculator (wp-admin/admin-ajax.php action=get_fare, ~100 station pairs; it
    returns single-journey token fare and km): 5 for 0.92–2.40 km, 10 for 3.06–7.05, 15 for
    7.53–12.50, 20 for 13.41–17.39, 25 for 17.57–22.95, 30 for 22.75–29.66, 35 for 30.09–37.15,
    40 for 37.99–45.70 km. Neighbouring slabs overlap by ~0.3 km, so boundaries are approximate;
    the 5/10/15/20/25 steps at 2.5 km then 5 km intervals match early reports of Rs 5 for the first
    2.5 km. Maximum observed fare Rs 40. Tokens and GMRC CSC cannot be used between Phase 1 and
    Phase 2 stations (fare rules page); QR tickets have no published discount.
  source_urls:
    - https://www.gujaratmetrorail.com/ahmedabad/route-and-fares/
    - https://www.gujaratmetrorail.com/ahmedabad/fare-rules/
    - https://www.gujaratmetrorail.com/ahmedabad/smart-cards/
    - https://www.gujaratmetrorail.com/ahmedabad/national-common-mobility-card-ncmc/

