    notes: >-
      GMRC timetable w.e.f. 2026-05-18, "Monday to Sunday": 06:40–08:00 "Average 40 Minutes",
      08:00–21:00 "Average 24 Minutes" (extended here to the last departure). First 06:55 from
      Koteshwar Road, 06:40 from Mahatma Mandir; last 21:20 from Koteshwar Road, 21:00 from Mahatma
      Mandir. 43 min, 20.87 km. GMRC's trip-level "tentative" timetable PDF shows these trains
      running through from/to APMC on the Red Line. The network map draws all N–S services in red
      (#E31E25); the timetable sheet's yellow bar is used to distinguish the line, matching the
      "Yellow Line" name used in OSM (colour tag #FFFF00). Motera–Sector 1 opened 2024-09-17;
      Sector 1–Mahatma Mandir opened in 2025–2026 (Wikipedia).

  - id: ahd-violet
