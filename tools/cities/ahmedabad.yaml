      sunday: same_as_weekday
    avg_speed_kmh: null
    source_urls:
      - https://www.gujaratmetrorail.com/ahmedabad/wp-content/uploads/2026/05/Revised-Time-Table-on-18.05.2026updated.jpg
    notes: >-
      GMRC timetable w.e.f. 2026-05-18: "Monday to Sunday (From 06:16 Hrs. to 22:00 Hrs.)" every
      12 min; 22:00–23:00 every 20 min. First 06:20 from APMC, 06:16 from Koteshwar Road; last 23:10
      from APMC, 23:00 from Koteshwar Road. End-to-end 35 min, 20.2 km. The operating line now ends
      at Koteshwar Road (one stop beyond Motera Stadium); OSM relations still end at Motera Stadium.
      Opened to the public 2022-10-06 (inaugurated 2022-09-30) per Wikipedia.

