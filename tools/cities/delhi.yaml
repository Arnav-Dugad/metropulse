id: delhi
name: Delhi
state: Delhi NCR  # lines also run into Haryana (Gurugram, Faridabad, Bahadurgarh) and Uttar Pradesh (Noida, Ghaziabad)
timezone: Asia/Kolkata
# APPROXIMATE envelope around the DMRC termini (Raja Nahar Singh, Brig. Hoshiar Singh,
# Samaypur Badli, Noida Electronic City, Vaishali, Shiv Vihar). NOT from an operator source:
# verify against the OSM relation bounds before use.
bbox: [28.33, 76.88, 28.77, 77.42]
checked: 2026-10-29

# How the timetable values were obtained:
# first/last = the DMRC website "First/Last Train Time" tool (delhimetrorail.com home page),
# queried on Thursday 2026-10-29 from each terminus to the ADJACENT station on the same line
# (so the answer is the first/last departure from that terminus, not a multi-line journey).
# These are therefore WEEKDAY values. DMRC does not publish line-wise headways or a Saturday/
# Sunday first/last table in text form that could be found, so those are null.
# DMRC disclaimer on the same page: "train timings, runtime ... is indicative and subject to change".

