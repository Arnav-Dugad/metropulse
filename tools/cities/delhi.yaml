fares:
  type: distance_slab
  currency: INR
  # Monday–Saturday (all lines except the Airport Express Line); effective 2025-08-25
  slabs:
    - {max_km: 2, fare: 11}
    - {max_km: 5, fare: 21}
    - {max_km: 12, fare: 32}
    - {max_km: 21, fare: 43}
    - {max_km: 32, fare: 54}
    - {max_km: null, fare: 64}
  # EXTRA KEY (not in README schema): Sundays and national holidays
  sunday_holiday_slabs:
    - {max_km: 2, fare: 11}
    - {max_km: 5, fare: 11}
    - {max_km: 12, fare: 21}
    - {max_km: 21, fare: 32}
    - {max_km: 32, fare: 43}
    - {max_km: null, fare: 54}
  peak_windows:
    - {days: mon_sat, from: "08:00", to: "12:00"}
    - {days: mon_sat, from: "17:00", to: "21:00"}
  discounts:
    # FAQ Q20: 10% on every smart-card journey, plus an extra 10% for entry outside 08:00-12:00 and
    # 17:00-21:00 on Monday-Saturday. National holidays (26 Jan, 15 Aug, 2 Oct) are not modelled.
    - {media: smart_card, percent: 10, timeframe: peak, days: mon_sat, note: "Peak hours, Monday-Saturday (DMRC FAQ Q20)"}
    - {media: smart_card, percent: 20, timeframe: offpeak, days: mon_sat, note: "10% plus the extra 10% off-peak, Monday-Saturday (DMRC FAQ Q20)"}
    - {media: smart_card, percent: 10, days: sunday, note: "Every journey on Delhi Metro Smart Card / Virtual Smart Card / NCMC (DMRC FAQ Q20, Q64). Not given on entry/exit mismatch or entry and exit at the same station (Q21)."}
    - {media: qr_ticket_multiple_journey, percent: 10, verified: false, note: "Multiple Journey QR Ticket (MJQRT): 10% in peak (08:00–12:00, 17:00–21:00) and 20% off-peak, per Outlook Traveller 13 Sep 2024 at launch. Not verified on a DMRC page, so it may be stale. No discount found for single-journey QR tickets."}
  notes: >-
    Slabs from Business Today (25 Aug 2025), confirmed by The Week and ETV Bharat for the
    weekday 0–2, 12–21, 21–32 and >32 km slabs and the Sunday 12–21 and >32 km slabs. This was
    the first revision since 2017, and no later revision was found up to 2026-10-29. DMRC FAQ
    Q29: the fare depends on the shortest-route distance between stations. Airport Express
    Line fares are a separate table that rose "up to ₹5" in Aug 2025 (DMRC post quoted by
    ETV Bharat); the slab values were not found. Rapid Metro Gurugram (₹20 flat) is in
    gurugram.yaml. The DMRC fare page (delhimetrorail.com/fare-structure) returned "We didn't
    find any data" when read.
  source_urls:
    - https://www.businesstoday.in/amp/india/story/delhi-metro-fare-hike-dmrc-increases-prices-by-up-to-rs-4-from-aug-25-check-details-490867-2025-08-25
    - https://www.theweek.in/news/india/2025/08/25/delhi-metro-fare-hike-minimum-ticket-price-now-is-11-check-full-details-here.amp.html
    - https://www.etvbharat.com/en/!state/delhi-metro-raises-passenger-fares-with-effect-from-monday-enn25082500642
    - https://delhimetrorail.com/faq-tickets-fare
    - https://www.outlooktraveller.com/News/all-about-the-metro-fee-hike-what-commuters-need-to-know
    - https://www.outlooktraveller.com/News/delhi-metro-introduces-qr-tickets-for-multiple-journeys-starting-today

notes: >-
  NETWORK STATE ON 2026-10-29: the DMRC home page reports 12 lines, 416 km and 303 stations,
  "including NOIDA-Greater NOIDA Aqua Line, Rapid Metro Gurugram". Its Service Status widget
  lists Line 1 Red, 2 Yellow, 3 Blue, 4 Blue, 5 Green, 6 Violet, 7 Pink, 7 Extension, 8 Magenta,
  8 Extension, 9 Grey, Airport Express (Orange) and Rapid Metro (RMGL).
  SECTIONS OPENED AFTER AUGUST 2023 (2023 GTFS is missing these): (1) Airport Express Dwarka
  Sector 21 – Yashobhoomi Dwarka Sector 25, 17 Sep 2023; (2) Magenta Janakpuri West – Krishna
  Park Extension, 5 Jan 2025; (3) Pink Line Phase 4 Majlis Park – Maujpur-Babarpur, 8 Mar 2026;
  (4) Magenta Line Phase 4 Deepali Chowk – Majlis Park, 8 Mar 2026.
  NOT OPEN (excluded): Golden Line Tughlakabad – Aerocity. Web search summaries of Metro Rail
  News (updated 29 Sep 2026) and Construction World say DMRC is targeting December 2026 for the
  first stretch, Tughlakabad – Sangam Vihar, with no trial runs or CMRS inspection reported.
  Neither page was read in full. The Golden Line is absent from DMRC's Service Status widget
  on 2026-10-29, and Wikipedia lists it as upcoming. Magenta Krishna Park Extension –
  Deepali Chowk is also not open.
  RECENT SERVICE CHANGES: DMRC press release of 21 Oct 2026 says 20 additional trips are added
  on weekdays (Mon–Fri) from 22 Oct 2026 under GRAP-I. A DMRC notice dated 29 Oct 2026 says
  all lines except the Airport Express run until 00:00 on 30 Oct 2026 only, for a concert.
  The DMRC home page also has a notice titled "timings for commencement of Sunday services on
  Phase-III corridors revised", but its content could not be read.
  Colours are the CSS colours DMRC's own website uses in its Service Status widget. They are
  not a published brand palette. OSM tags differ, e.g. Yellow is #FFDF00 in OSM.

