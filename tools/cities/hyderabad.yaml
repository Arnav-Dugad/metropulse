    name: Red Line
    long_name: Miyapur – L B Nagar
    operator: L&T Metro Rail (Hyderabad) Limited (L&TMRHL)
    colour: "#E31E24"
    colour_source: operator network map https://ltmetro.com/wp-content/uploads/2025/01/HMRRouteMap_new.pdf (vector RGB fill of the line)
    mode: metro
    termini: [Miyapur, L B Nagar]
    opened: null
    osm:
      ref: "1"
      name_contains: "Red Line"
    timetable:
      weekday:
        first: "06:00"
        last: "23:00"
        headways:
          - {from: "06:00", to: "08:00", minutes: 4.83}
          - {from: "08:00", to: "10:30", minutes: 3.67}
          - {from: "10:30", to: "17:00", minutes: 4.83}
          - {from: "17:00", to: "20:00", minutes: 3.67}
          - {from: "20:00", to: "23:00", minutes: 4.83}
      saturday: {first: "06:00", last: "23:00", headways: null}
      sunday: {first: "06:00", last: "23:00", headways: null}
    avg_speed_kmh: null
    source_urls:
      - https://ltmetro.com/train-timings/
      - https://hmrl.co.in/train-timings/
      - https://hmrl.co.in/wp-content/uploads/2026/04/Press-Statement-frequesncy-augementation-22.4.20206-old.pdf
    notes: >-
      First and last trains come from L&TMRHL: "Monday to Sunday: First train at 06:00 hrs, last train from terminal
      stations at 23:00 hrs in Red & Blue line ... on all days". Headways come from an HMRL press release dated
      22.04.2026 describing normal weekday operation: 3 min 40 sec (3.67) in the peaks (08:00-10:30 and
      17:00-20:00) and 4 min 50 sec (4.83) off-peak on the Miyapur-LB Nagar (C1) corridor. The release does not
      give separate early-morning or late-evening values, so the off-peak value is applied from first to last train.
      Saturday and Sunday headways are not published.

