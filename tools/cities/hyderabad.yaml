    notes: >-
      First and last trains are the same as on the Red Line (L&TMRHL, all days). HMRL press release (22.04.2026):
      3 min 40 sec (3.67) in the 08:00-10:30 and 17:00-20:00 weekday peaks and 5 min 20 sec (5.33) off-peak on the
