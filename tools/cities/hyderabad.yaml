      L&TMRHL: first train 06:00 and last train from terminals 23:35 on the Green Line, on all days. No headway is
      published for the Green Line (C2). The April 2026 HMRL release covers only C1 and C3.

fares:
  type: distance_slab
  currency: INR
  slabs:
    - {max_km: 2, fare: 11}
    - {max_km: 4, fare: 17}
    - {max_km: 6, fare: 28}
    - {max_km: 9, fare: 37}
    - {max_km: 12, fare: 47}
    - {max_km: 15, fare: 51}
    - {max_km: 18, fare: 56}
    - {max_km: 21, fare: 61}
    - {max_km: 24, fare: 65}
    - {max_km: null, fare: 69}
  discounts: []
  notes: >-
    L&TMRHL press release PR/189 dated 23-05-2025, effective 24 May 2025. The FFC fare zones are given as "up to 2",
    "more than 2 up to 4", and so on up to "more than 24", which is open-ended here (max_km null). These fares
    already include a 10% discount on the FFC increase. They apply to all fare media (paper QR/token, digital tickets,
    smart cards), so no separate smart card or QR discount is recorded. No metro fare revision after May 2025 was
    found as of 2026-10-29. An RTC-Metro common pass was under review in October 2026 and is not modelled.
  source_urls:
    - https://ltmetro.com/fare-ticketing/
    - https://ltmetro.com/wp-content/uploads/2025/05/Hyderabad-Metro-Rail-Revised-Fare-Chart-Final.pdf
    - https://ltmetro.com/ticketing/

