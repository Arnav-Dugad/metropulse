fares:
  type: distance_slab
  currency: INR
  slabs:
    - {max_km: 2, fare: 10}
    - {max_km: 4, fare: 20}
    - {max_km: 6, fare: 30}
    - {max_km: 8, fare: 40}
    - {max_km: 10, fare: 50}
    - {max_km: 15, fare: 60}
    - {max_km: 20, fare: 70}
    - {max_km: 25, fare: 80}
    - {max_km: 30, fare: 90}
    - {max_km: null, fare: 90}
  discounts:
    - {media: smart_card, percent: 5, note: "Base smart card discount, all times (BMRCL fare rules: 5% off token fare)"}
    - {media: smart_card, percent: 10, note: "Weekday off-peak (5% + 5%), by entry time: start of service-08:00, 12:00-16:00, 21:00-close"}
    - {media: smart_card, percent: 10, note: "All day on Sundays and on 26 Jan, 15 Aug and 2 Oct"}
  notes: >-
    Slabs come from the BMRCL media release of 08.02.2025 (Fare Fixation Committee fares, effective 09.02.2025);
    the >30 km slab is open-ended (max_km null). On 13 Feb 2025 BMRCL cut fares from 14 Feb 2025 on certain
    station pairs where the increase was above 70% (The Federal, 2025-02-14). The MD said minimum Rs 10 and maximum
    Rs 90 were unchanged and that there was "no overall revision". For those pairs the actual fare can be lower
    than the slab. BMRCL announced a further revision of up to 5% effective 09.02.2026 (11/21/32/42/53/63/74/84/95/95),
    then put it on hold before it took effect (Trayaan, 2026-02-05, updated 2026-02-08). Siasat (2026-07-24)
    confirms the hike was deferred and fares still run Rs 10-90. That report also mentions a proposal to revise
    fares by 12% every three years from Feb 2028, with no decision taken. The Trayaan report of BMRCL's 2026 post
    says the smart card discounts also apply to mobile QR travel-pass users. Whether single-journey QR tickets get
    any discount could not be confirmed (a Feb 2025 Deccan Herald headline mentions "QR ticket discount removal",
    but the article could not be opened), so no QR discount is recorded. Tourist cards: 1/3/5 days Rs 300/600/800. Group tickets get 15-25% off (not modelled).
  source_urls:
    - https://english.bmrc.co.in:8282/English/uploads/news/english/fileuploads/1739069224825$@!!Media%20Brief%20-English-%20Fin%2008.02.2025%20(1).pdf
    - https://english.bmrc.co.in/fare-rules
    - https://thefederal.com/category/states/south/karnataka/bmrcl-metro-rail-fare-siddramaiah-bengaluru-171731
    - https://www.trayaan.com/2026/02/bengaluru-metro-train-fares-to-be-hiked-from-9-february-2026-details.html
    - https://www.siasat.com/namma-metro-may-get-costlier-again-3512363/
    - https://www.oneindia.com/bengaluru/namma-metro-fare-hike-in-2026-on-hold-bmrcl-pauses-talks-amid-public-concerns-7971277.html

