unknowns:
  - lines.*.timetable (first/last trains and headways; GTFS expected to cover these)
  - lines.*.opened
  - lines.*.avg_speed_kmh
  - fares.discounts qr_ticket (single-journey QR discount status unconfirmed)
  - Pink Line (Kalena Agrahara-Tavarekere elevated section) excluded; no report of it opening by 2026-10-29 was found, and the BMRCL schematic map (Version 05) shows only Purple, Green and Yellow as operational, but the opening status was not confirmed from a BMRCL notice
